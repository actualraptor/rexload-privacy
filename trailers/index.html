<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rexload trailers</title>
<meta name="description" content="Watch the Rexload trailers: the app, co-op training, and the full co-op tour.">
<meta property="og:title" content="Rexload trailers">
<meta property="og:image" content="https://actualraptor.github.io/rexload-privacy/trailers/poster-trailer.jpg">
<link rel="icon" href="../join/icon.png">
<style>
:root{--bg:#0f0d1c;--card:#191630;--ink:#efecff;--muted:#a9a3c6;--line:#2c2850;--accent:#ff4fd8;--num:#0f0d1c}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f4fb;--card:#fff;--ink:#1b1830;--muted:#5d5875;--line:#e3dff0;--accent:#c4148f;--num:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;gap:14px;align-items:center;margin-bottom:6px}
header img{width:56px;height:56px;border-radius:14px}
h1{font-size:26px;margin:0}
.lead{color:var(--muted);margin:10px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
video{display:block;width:100%;aspect-ratio:9/16;border-radius:12px;background:#000}
figcaption{padding:10px 4px 2px}
figcaption b{display:block;font-size:18px}
figcaption span{color:var(--muted);font-size:15px}
.cta{display:inline-block;margin-top:26px;background:var(--accent);color:var(--num);font-weight:700;text-decoration:none;padding:12px 18px;border-radius:12px}
footer{margin-top:28px;color:var(--muted);font-size:14px}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
<header><img src="../join/icon.png" alt="Rexload icon"><h1>Rexload trailers</h1></header>
<p class="lead">Lift, log, level up. Tap a video to play it.</p>
<div class="grid">
<figure>
<video controls playsinline preload="metadata" poster="poster-trailer.jpg"><source src="rexload-trailer.mp4" type="video/mp4"></video>
<figcaption><b>Rexload</b><span>32 s · the app in a nutshell</span></figcaption>
</figure>
<figure>
<video controls playsinline preload="metadata" poster="poster-coop.jpg"><source src="rexload-coop-trailer.mp4" type="video/mp4"></video>
<figcaption><b>Co-op</b><span>24 s · train together</span></figcaption>
</figure>
<figure>
<video controls playsinline preload="metadata" poster="poster-coop-full.jpg"><source src="rexload-coop-full.mp4" type="video/mp4"></video>
<figcaption><b>Co-op, the full tour</b><span>74 s · one phone or two phones live</span></figcaption>
</figure>
</div>
<a class="cta" href="../join/">Join the test on Google Play</a>
<footer><a href="../">Privacy policy</a> · <a href="mailto:rexloadapp@gmail.com">rexloadapp@gmail.com</a></footer>
</main>
</body>
</html>
